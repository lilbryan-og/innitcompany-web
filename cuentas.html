<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>INNIT · Cuentas</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --w:#121212; --w2:#1b1b1b; --w3:#262626; --line:rgba(255,255,255,.07);
  --ink:#f5f3ee; --dim:#8f8f8f; --faint:#5c5c5c;
  --g:#f5f3ee; --g-hi:#ffffff; --g-mid:#8a8a8a; --g-lo:#4a4a4a; --g-deep:#222222; --g-ink:#000000;
  --bad:#ff6b6b; --warn:#cfcfcf;
  --sans:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; --r:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--g-hi);outline-offset:3px;border-radius:8px}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:200px;flex:0 0 200px;background:#000;border-right:1px solid var(--line);padding:18px 8px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:2px 10px 20px;display:flex;align-items:center;gap:10px}
.brand img{height:16px}
.brand small{font-family:var(--mono);font-size:10px;color:var(--g-hi);border:1px solid var(--g-lo);border-radius:20px;padding:2px 8px}
.nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:none;color:var(--dim);padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:500;text-align:left;margin-bottom:2px}
.nav button:hover{color:#fff}
.nav button.on{background:var(--g);color:var(--g-ink);font-weight:600}
.nav svg{width:16px;height:16px;flex:0 0 16px}
.side-foot{margin-top:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600}
.who i{width:28px;height:28px;border-radius:50%;background:var(--g);color:var(--g-ink);display:grid;place-items:center;font-style:normal;font-size:12px}
.side-foot a,.side-foot button{color:var(--dim);font-size:12.5px;background:none;border:none;text-align:left;text-decoration:none;padding:0}
.side-foot a:hover,.side-foot button:hover{color:#fff}
/* main */
.main{flex:1;min-width:0;padding:22px 24px 60px;max-width:1500px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:30px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:13px;margin-top:6px}
.lbl{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.pill{display:flex;align-items:center;gap:6px;background:var(--w);border:1px solid var(--line);border-radius:999px;padding:4px 6px;font-size:12.5px;font-family:var(--mono)}
.pill button{background:none;border:none;font-size:16px;line-height:1;width:30px;height:30px;border-radius:50%;color:var(--ink)}
.pill button:hover{background:var(--w3)}
.pill span{min-width:120px;text-align:center}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--w);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi .l{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.kpi .v{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.03em;margin-top:12px;line-height:1.1}
.kpi .n{font-size:12.5px;color:var(--dim);margin-top:8px}
.kpi.hero{background:linear-gradient(160deg,#ffffff,#c4c4c4);color:var(--g-ink);border-color:transparent}
.kpi.hero .l,.kpi.hero .n{color:rgba(0,0,0,.7)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;margin-right:6px;white-space:nowrap}
.tag.good{background:var(--g-deep);color:var(--g-hi)} .tag.bad{background:rgba(255,107,107,.14);color:var(--bad)} .tag.warn{background:rgba(255,255,255,.08);color:var(--warn)} .tag.mute{background:var(--w3);color:var(--dim)}
.kpi.hero .tag{background:rgba(0,0,0,.15);color:var(--g-ink)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.strip .card{padding:13px 18px;display:flex;justify-content:space-between;font-size:13px;border-radius:16px}
.strip b{font-weight:500;font-family:var(--mono)}
.two{display:grid;grid-template-columns:1.65fr 1fr;gap:12px;margin-top:12px}
.card h2{font-size:15.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h2 a,.link{font-size:12px;font-weight:500;color:var(--g-hi);background:none;border:none;text-decoration:none}
.bars{display:flex;align-items:flex-end;gap:14px;height:190px;margin-top:22px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--dim);font-family:var(--mono)}
.bar .val{color:var(--ink);font-size:11px;white-space:nowrap}
.bar .col{width:min(34px,100%);border-radius:8px 8px 0 0;background:var(--g-lo);min-height:4px}
.bar.cur .col{background:var(--g)}
.legend{font-size:11.5px;color:var(--dim);margin-top:14px}
.attn-item{display:flex;gap:12px;align-items:center;padding:11px 0}
.attn-item .ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--warn);display:grid;place-items:center;font-weight:700;flex:0 0 34px}
.attn-item .t{font-size:13px;font-weight:500}.attn-item .s{font-size:11.5px;color:var(--dim);margin-top:2px}
.attn-item.ok .ic{background:var(--g-deep);color:var(--g-hi)}
.cat{margin-top:12px}.cat .r{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.cat .r b{font-family:var(--mono);font-weight:500}
.cat .t{height:8px;background:var(--g-deep);border-radius:5px;overflow:hidden}.cat .t i{display:block;height:100%;background:var(--g);border-radius:5px}
/* table */
.tbl{margin-top:12px;overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:8px}
th{font-size:11px;font-weight:500;color:var(--dim);text-align:left;padding:4px 12px;font-family:var(--mono)}
td{background:var(--w2);padding:13px 12px;font-size:13px;vertical-align:middle}
td:first-child{border-radius:12px 0 0 12px}td:last-child{border-radius:0 12px 12px 0}
td.num,th.num{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
td.num{font-family:var(--mono)}
td b{font-weight:600}
.row-actions button{background:none;border:none;color:var(--dim);font-size:12px;text-decoration:underline;margin-left:10px;font-family:var(--sans)}
.row-actions button:hover{color:var(--ink)}
.empty{color:var(--dim);font-size:13px;padding:18px 4px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--g);color:var(--g-ink);border:none;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600}
.btn:hover{filter:brightness(1.08)}.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.btn:disabled{opacity:.5}
/* socios */
.partners{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.big-balance{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.03em;margin-top:12px}
/* reservas */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.client .nm{font-size:19px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.client .mini3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.client .mini3 .bad b{color:var(--bad)}
.client .mini3 div{background:var(--w2);border-radius:14px;padding:10px 12px}
.client .mini3 b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;margin-top:4px}
.client .ln{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.client .ln b{font-family:var(--mono);font-weight:500}
.client .tot{font-family:var(--mono);font-size:28px;font-weight:500;letter-spacing:-.03em;margin:12px 0 14px}
.client .tot span{font-family:var(--sans);font-size:12px;color:var(--dim);letter-spacing:0;margin-left:4px}
.client .acts{display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:8px 13px;font-size:12px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.mcal .h{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;padding-bottom:2px}
.mcal .d{background:var(--w2);border-radius:12px;min-height:84px;padding:7px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mcal .d.o{background:none}
.mcal .d.t{box-shadow:inset 0 0 0 1.5px var(--g)}
.mcal .n{font-family:var(--mono);font-size:11px;color:var(--dim)}
.chip{font-size:11px;font-weight:600;border-radius:7px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--c,#d8d8d8);color:#000}
.chip.ex{background:none;color:var(--c,#d8d8d8);box-shadow:inset 0 0 0 1.5px var(--c,#d8d8d8)}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.chip.x{background:none;color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,107,107,.5);text-decoration:line-through}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:12px}
.keyrow .chip{display:inline-block;margin-right:6px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.scrim.on{display:flex}
.modal{background:var(--w);border:1px solid var(--line);border-radius:24px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px}
.modal h3{font-size:19px;font-weight:600;margin-bottom:14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f .full{grid-column:1/-1}
.f label{font-size:11.5px;color:var(--dim);display:block;margin-bottom:5px;font-family:var(--mono)}
.f input,.f select{width:100%;border:1px solid transparent;background:var(--w2);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:13px;font-family:inherit}
.f select option{background:#fff;color:#111}
.f input:focus,.f select:focus{outline:none;border-color:var(--g-mid)}
.f input{color-scheme:dark}
.preview{background:var(--w2);border-radius:14px;padding:11px 13px;font-size:12.5px;color:var(--dim);margin-top:12px;line-height:1.5}
.preview b{color:var(--ink)}
.err{color:var(--bad);font-size:12px;margin-top:10px;min-height:14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
/* recibo: documento claro para enviar al cliente */
.rec{background:#fff;color:#0b0b0d;width:720px;max-width:100%;padding:36px;font-family:var(--sans)}
.rec .rh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0b0b0d;padding-bottom:16px}
.rec .rh img{height:34px}
.rec .rh .rt{text-align:right;font-size:11px;color:#6b6b76;line-height:1.5}
.rec h4{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:22px}
.rec .rm{font-size:13px;color:#6b6b76;margin-top:4px}
.rec .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px}
.rec .cal .h{font-size:10px;color:#6b6b76;text-align:center;font-weight:600}
.rec .cal .d{aspect-ratio:2.3;border-radius:8px;background:#f2f2f2;font-size:12px;display:flex;align-items:center;justify-content:center;color:#444}
.rec .cal .d.o{background:transparent}
.rec .cal .d.f{background:var(--c,#0b0b0d);color:#000;font-weight:700}
.rec .cal .d.e{background:#fff;color:#0b0b0d;font-weight:700;box-shadow:inset 0 0 0 2px var(--c,#0b0b0d)}
.rec .lg{display:flex;gap:16px;font-size:11px;color:#6b6b76;margin-top:10px}
.rec .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rec table{width:100%;border-collapse:collapse;margin-top:16px;font-size:12px}
.rec th{text-align:left;color:#6b6b76;font-weight:500;padding:6px 4px;border-bottom:1px solid #e4e4ea;font-family:var(--sans)}
.rec td{background:none;padding:8px 4px;border-bottom:1px solid #f0f0f3;border-radius:0}
.rec td:first-child,.rec td:last-child{border-radius:0}
.rec .sum{margin-top:18px;margin-left:auto;width:min(420px,100%);font-size:13px}
.rec .sum div span:last-child{white-space:nowrap;padding-left:12px}
.rec .sum div{display:flex;justify-content:space-between;padding:5px 0}
.rec .sum div.pv{background:#fff4f2;margin:4px 0;padding:8px 10px;border-radius:8px;border-left:3px solid #e5484d}
.rec .sum div.pv small{display:block;font-size:11px;color:#b4232a;margin-top:2px;font-weight:500}
.rec .sum .t{border-top:2px solid #0b0b0d;margin-top:6px;padding-top:10px;font-size:18px;font-weight:800}
.rec .stt{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:4px 10px;margin-top:14px}
.rec .stt.p{background:#ececec;color:#111111}.rec .stt.n{background:#f3f3f3;color:#555555}
.rec .rf{margin-top:24px;font-size:10.5px;color:#8d8d98;line-height:1.5;border-top:1px solid #e4e4ea;padding-top:12px}
.scrim.big .modal{max-width:820px;overflow:hidden}
.scrim.big .recscroll{overflow:auto;border-radius:14px;max-height:calc(92vh - 130px)}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  body>*:not(#rec-scrim){display:none!important}
  #rec-scrim{position:static!important;display:block!important;background:none!important;padding:0!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  #rec-scrim .modal{position:static!important;display:block!important;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;max-height:none!important;width:auto!important;transform:none!important;animation:none!important}
  #rec-scrim .recscroll{overflow:visible!important;max-height:none!important;padding:0!important;background:none!important}
  #rec-scrim .mfoot,#rc-err{display:none!important}
  #rec-scrim,#rec-scrim .modal,#rec-scrim .recscroll{overflow:visible!important;margin:0!important;width:auto!important;max-width:none!important}
  #rec-doc{box-sizing:border-box!important;width:auto!important;max-width:none!important;margin:0!important;padding:0 1mm!important;border-radius:0!important;box-shadow:none!important}
  #rec-doc *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* login */
.login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.login .box{background:var(--w);border:1px solid var(--line);border-radius:24px;padding:28px;width:100%;max-width:360px}
.login h1{font-size:22px}.login .f{grid-template-columns:1fr;margin-top:16px}
.denied{padding:60px 20px;text-align:center;color:var(--dim)}
@media(max-width:1100px){
  .kpis,.strip{grid-template-columns:1fr 1fr}.two,.partners{grid-template-columns:1fr}
}
@media(max-width:760px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px;gap:6px;flex:none;border-right:none;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px}.nav{display:flex;gap:2px;flex-wrap:wrap}.nav button{width:auto;padding:8px 10px}.nav button span{display:none}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center}.who span{display:none}
  .main{padding:16px 14px 60px}.top{flex-direction:column;align-items:flex-start}h1{font-size:24px}
  .kpis,.strip{grid-template-columns:1fr 1fr}.kpi .v{font-size:21px}
  th.hide-m,td.hide-m{display:none}.bars{gap:6px}
  td{padding:11px 8px;font-size:12.5px}th{padding:4px 8px}td:first-child{white-space:nowrap}
  .mcal{gap:3px}.mcal .d{min-height:46px;padding:4px;border-radius:8px}
  .mcal .chip{font-size:0;padding:0;height:6px;border-radius:3px}
}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="box">
    <h1>INNIT · Cuentas</h1>
    <div class="sub">Área privada de socios.</div>
    <div class="f">
      <div><label>Email</label><input id="l-email" type="email" autocomplete="username"></div>
      <div><label>Contraseña</label><input id="l-pass" type="password" autocomplete="current-password"></div>
    </div>
    <div class="err" id="l-err"></div>
    <button class="btn" id="l-go" style="width:100%;margin-top:6px">Entrar</button>
    <a href="index.html?acceso=1" style="display:block;text-align:center;margin-top:12px;font-size:12.5px;color:var(--dim)">¿Olvidaste tu contraseña?</a>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="brand"><img src="logo-innit-white.png" alt="INNIT"><small>Cuentas</small></div>
    <nav class="nav" id="nav">
      <button data-v="res" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/></svg><span>Reservas</span></button>
      <button data-v="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Gastos</span></button>
      <button data-v="mov"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Movimientos</span></button>
      <button data-v="socios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14.2c2.4 0 4 1.8 4 4.3"/></svg><span>Socios</span></button>
      <button data-v="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span>Exportar</span></button>
    </nav>
    <div class="side-foot">
      <div class="who"><i id="who-i">I</i><span id="who-n"></span></div>
      <a href="espacio.html">Miembros</a>
      <a href="index.html">← Volver a la web</a>
      <button id="logout">Cerrar sesión</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="scrim" id="scrim">
  <div class="modal">
    <h3>Nuevo movimiento</h3>
    <div class="f">
      <div><label>Tipo</label><select id="m-kind"><option value="gasto">Gasto (factura)</option><option value="ingreso">Ingreso</option><option value="liquidacion">Liquidación entre socios</option></select></div>
      <div><label id="m-partner-l">Lo pagó</label><select id="m-partner"><option>BRYAN</option><option>LEANDRO</option><option value="CAJA" id="m-caja-opt">CAJA INNIT</option></select></div>
      <div><label>Fecha</label><input id="m-date" type="date"></div>
      <div id="m-cat-w"><label>Categoría</label><select id="m-cat"></select></div>
      <div class="full"><label>Concepto</label><input id="m-concept" placeholder="Ej. Factura luz septiembre"></div>
      <div class="full" id="m-sup-w"><label>Proveedor (opcional)</label><input id="m-supplier"></div>
      <div><label>Base imponible (€)</label><input id="m-base" inputmode="decimal" placeholder="0,00"></div>
      <div id="m-vat-w"><label>IVA %</label><input id="m-vat" inputmode="decimal" value="21"></div>
      <div class="full" id="m-file-w"><label>Factura (PDF o foto)</label><input id="m-file" type="file" accept="application/pdf,image/*"></div>
    </div>
    <div class="preview" id="m-prev"></div>

function positions(L){
  /* Los ingresos "CAJA INNIT" entran en la caja de la empresa: cuentan como ingreso, pero no mueven el balance entre socios */
  let g=0,i=0,caja=0;const c={BRYAN:0,LEANDRO:0},paid={BRYAN:0,LEANDRO:0};
  L.forEach(e=>{const o=e.partner==='BRYAN'?'LEANDRO':'BRYAN';
    if(e.partner==='CAJA'){if(e.kind==='ingreso'){i+=e.base_cents;caja+=e.base_cents;}return;}
    if(e.kind==='gasto'){g+=e.base_cents;c[e.partner]+=e.base_cents;paid[e.partner]+=e.base_cents;}
    else if(e.kind==='ingreso'){i+=e.base_cents;c[e.partner]-=e.base_cents;}
    else{c[e.partner]+=e.base_cents;c[o]-=e.base_cents;}});
  const net=g-(i-caja),half=net/2;
  return{gastos:g,ingresos:i,caja,net,paid,bal:{BRYAN:Math.round(c.BRYAN-half),LEANDRO:Math.round(c.LEANDRO-half)}};
}

$('m-save').onclick=async()=>{
  const kind=$('m-kind').value,partner=$('m-partner').value,date=$('m-date').value,concept=$('m-concept').value.trim();

    const blob=await recBlob();const file=new File([blob],fname(),{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:msg});return;}
    dl(blob);
  }catch(e){if(e&&e.name==='AbortError')return;$('rc-err').textContent='No se pudo generar la imagen; usa Imprimir / PDF.';}
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank','noopener');
  $('rc-err').textContent='Imagen descargada: adjúntala en el chat de WhatsApp que se ha abierto.';
};
let rateFor=null;
function openRate(n){
  rateFor=n;const r=rates[n]||{};$('rt-title').textContent='Tarifa · '+n;
  $('rt-fixed').value=r.fixed_fee_cents?(r.fixed_fee_cents/100).toString().replace('.',','):'';
  $('rt-extra').value=r.extra_cents?(r.extra_cents/100).toString().replace('.',','):'';
  $('rt-unit').value=r.extra_unit||'dia';$('rt-vat').value=r.vat_rate!=null?r.vat_rate:21;$('rt-phone').value=r.phone||'';
  $('rt-mode').value=r.fixed_mode||'dia';$('rt-day').value=r.fijo_day_cents?(r.fijo_day_cents/100).toString().replace('.',','):'';
  const uid=(profsAll.find(p=>p.name===n)||{}).id,g=goalsBy[uid];$('rt-start').value=g&&g.start_date||'';rtMode();
  $('rt-err').textContent='';$('rate-scrim').classList.add('on');
}
function rtMode(){const dia=$('rt-mode').value==='dia';$('rt-day-w').style.display=dia?'':'none';$('rt-fixed-w').style.display=dia?'none':'';}
$('rt-mode').addEventListener('change',rtMode);
$('rt-cancel').onclick=()=>$('rate-scrim').classList.remove('on');
$('rt-save').onclick=async()=>{
  const f=$('rt-fixed').value.trim()?toCents($('rt-fixed').value):0,x=$('rt-extra').value.trim()?toCents($('rt-extra').value):0,dd=$('rt-day').value.trim()?toCents($('rt-day').value):0;
  if(!isFinite(f)||!isFinite(x)||!isFinite(dd)||f<0||x<0||dd<0)return($('rt-err').textContent='Revisa los importes.');
  const uid=(profsAll.find(p=>p.name===rateFor)||{}).id;
  if(uid){const g=await sb.from('member_goals').upsert({user_id:uid,start_date:$('rt-start').value||null});if(g.error)return($('rt-err').textContent=g.error.message);}
  const {error}=await sb.from('client_rates').upsert({client_name:rateFor,fixed_mode:$('rt-mode').value,fijo_day_cents:dd,fixed_fee_cents:f,extra_cents:x,extra_unit:$('rt-unit').value,
    vat_rate:parseFloat(String($('rt-vat').value).replace(',','.'))||0,phone:$('rt-phone').value.trim()||null,updated_at:new Date().toISOString()});
  if(error)return($('rt-err').textContent=error.message);
  $('rate-scrim').classList.remove('on');await loadRec();render();
};


boot();
</script>
