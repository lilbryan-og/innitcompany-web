<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505">
<title>INNIT · Mi espacio</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pc:#d8d8d8;
  --bg:#050505; --w:#121212; --w2:#1b1b1b; --w3:#262626; --line:rgba(255,255,255,.07);
  --ink:#f5f3ee; --dim:#8f8f8f; --faint:#5c5c5c;
  /* una sola gama: verde */
  --g:#f5f3ee; --g-hi:#ffffff; --g-mid:#8a8a8a; --g-lo:#4a4a4a; --g-deep:#222222; --g-ink:#000000;
  --bad:#ff6b6b;
  --sans:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,.9,.2,1); --r:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--g-hi);outline-offset:3px;border-radius:8px}
.hide{display:none!important}
.mono{font-family:var(--mono)}

/* ---------- barra superior ---------- */
.bar{display:flex;align-items:center;gap:14px;padding:16px 20px;max-width:1180px;margin:0 auto}
.bar img{height:20px;display:block}
.bar .sp{flex:1}
.who{font-size:13px;color:var(--dim)}
.who b{color:var(--ink);font-weight:600}
.txtbtn{font-size:13px;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.txtbtn:hover{color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--w);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:7px;transition:color .2s,background .2s}
.tabs button svg{width:16px;height:16px}
.tabs button[aria-selected=true]{background:var(--g);color:var(--g-ink)}
.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--g-hi)}
.wrap{max-width:1180px;margin:0 auto;padding:6px 20px 150px}

/* selector de cliente (solo INNIT) */
.people{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.people button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--dim)}
.people button[aria-pressed=true]{border-color:var(--ink);color:var(--ink)}

/* cabecera del mes */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 18px}
h1{font-weight:600;font-size:clamp(22px,3.2vw,32px);line-height:1.15;letter-spacing:-.02em;max-width:24ch;text-wrap:balance}
.monthnav{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px}
.monthnav button{width:32px;height:32px;border-radius:50%;background:var(--w);border:1px solid var(--line);color:var(--ink);font-size:16px;line-height:1}
.monthnav button:disabled{opacity:.25;cursor:default}
.monthnav span{min-width:120px;text-align:center;font-family:var(--mono)}

/* ---------- widgets ---------- */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.w{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--w);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;overflow:hidden}
.w.s2{grid-column:span 2}.w.s4{grid-column:span 4}.w.r2{grid-row:span 2}
.lbl{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.wt{font-size:15px;font-weight:600}
.big{font-family:var(--mono);font-weight:500;font-size:34px;line-height:1;letter-spacing:-.02em}
.big small{font-size:15px;color:var(--dim);margin-left:3px;letter-spacing:0}
.glow::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.11),transparent 65%);left:-60px;top:-70px;pointer-events:none}

/* anillos */
.ringw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.rings{position:relative;width:100%;max-width:340px;aspect-ratio:1}
.rings svg{width:100%;height:100%;display:block;transform:rotate(-90deg);overflow:visible}
.rings circle{fill:none;stroke-linecap:round}
.rings .trk{opacity:.14}
.rings .res{opacity:.32;transition:stroke-dashoffset 1.5s var(--ease)}
.rings .arc{transition:stroke-dashoffset 1.5s var(--ease)}
.rings g{transition:opacity .25s}
.rings.f0 g:not(.r0),.rings.f1 g:not(.r1),.rings.f2 g:not(.r2){opacity:.2}
.rings .pulse{opacity:0}
.rings .pulse.go{animation:pulse 1.1s ease-out 1}
@keyframes pulse{0%{opacity:.5;stroke-width:22}100%{opacity:0;stroke-width:44}}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.center b{font-family:var(--mono);font-weight:500;font-size:clamp(18px,4vw,26px);line-height:1}
.center span{font-size:11px;color:var(--dim);margin-top:5px;font-family:var(--mono)}
.legend{display:grid;gap:2px;width:100%}
.legend button{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:12px;font-size:13.5px;transition:background .2s}
.legend button:hover,.legend button.on{background:var(--w2)}
.legend i{width:12px;height:12px;border-radius:50%}
.legend .v{font-family:var(--mono);font-size:13px;color:var(--dim)}
.legend .v b{color:var(--ink);font-weight:500}

/* racha */
.streak-top{display:flex;align-items:center;gap:14px;position:relative}
.flame{width:46px;height:52px;flex:0 0 46px;filter:drop-shadow(0 0 14px rgba(255,255,255,0.28))}
.flame.off{filter:none;opacity:.35}
.hr{height:1px;background:var(--line);margin:16px 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:7px}
.day .c{width:min(40px,100%);aspect-ratio:1;border-radius:50%;background:var(--w3);display:grid;place-items:center;position:relative;transform:scale(.6);opacity:0;transition:transform .5s var(--ease),opacity .4s}
.day .c.show{transform:none;opacity:1}
.day .c svg{width:52%;height:52%}
.day .c.done{background:var(--pc);color:#000;box-shadow:0 0 16px color-mix(in srgb,var(--pc) 45%,transparent)}
.day .c.rsv{background:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--pc) 55%,transparent)}
.day .c.today{background:none}
.day .c.today::after{content:"";position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent;border-top-color:var(--pc);border-right-color:var(--pc);animation:spin 1.6s linear infinite}
.day .c.miss{background:none;box-shadow:inset 0 0 0 2px rgba(255,107,107,.6);color:var(--bad)}
.day .c.fut{background:var(--w2)}
.day span{font-family:var(--mono);font-size:11px;color:var(--dim)}
.day.now span{color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.prog-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.prog-row .pct{font-family:var(--mono);color:var(--dim);font-size:15px}
.meter{height:12px;border-radius:999px;background:var(--g-deep);margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--g-mid),var(--g));transition:width 1.3s var(--ease)}

/* tokens en puntos */
.tok{margin-top:14px;display:grid;gap:14px}
.tok .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.tok .row b{font-family:var(--mono);font-weight:500;font-size:13px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots i{width:18px;height:18px;border-radius:6px;background:var(--w3);transform:scale(.4);opacity:0;transition:transform .45s var(--ease),opacity .35s}
.dots i.show{transform:none;opacity:1}
.dots i.on{background:var(--g);box-shadow:0 0 10px rgba(255,255,255,0.23)}
.dots i.rs{background:var(--g-lo)}

/* próximas */
.nxt-h{display:flex;justify-content:space-between;align-items:center}
.badge{font-family:var(--mono);font-size:12px;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--w3);display:grid;place-items:center}
.nlist{display:grid;gap:8px;margin-top:14px}
.ni{background:var(--w2);border-radius:16px;padding:11px 13px}
.ni:first-child{background:var(--pc);color:#000}
.ni b{display:block;font-weight:600;font-size:14px}
.ni span{font-size:12.5px;opacity:.75}
.cta{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:999px;background:var(--g);color:var(--g-ink);font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap}
.cta.line{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.cta:disabled{opacity:.5}

/* ---------- reproductor ---------- */
.player{padding:14px;background:#0c0c0c}
.led{width:100%;height:58px;display:block;border-radius:16px;background:#070707}
.pl-body{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:12px;margin-top:12px}
.deck{background:var(--w2);border-radius:20px;display:grid;place-items:center;padding:16px;position:relative;overflow:hidden}
.deck::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.06),transparent 60%);pointer-events:none}
.disc{width:min(200px,100%);aspect-ratio:1;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 50%,#050505 0 7%,var(--g) 7.5% 21%,#050505 21.5% 23%,transparent 23.5%),
  repeating-radial-gradient(circle at 50% 50%,#0d0d0d 0 2px,#161616 2px 3px);
  box-shadow:0 0 0 6px #0a0a0a,0 18px 40px rgba(0,0,0,.6);animation:spin 3.2s linear infinite;animation-play-state:paused}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 12%,rgba(255,255,255,.08) 16%,transparent 22% 62%,rgba(255,255,255,.06) 66%,transparent 72%)}
.disc.on{animation-play-state:running}
.panel{border-radius:20px;padding:16px 18px;background:linear-gradient(160deg,#ffffff,#c4c4c4);color:var(--g-ink);display:flex;flex-direction:column;min-width:0}
.panel .tt{display:flex;gap:12px;align-items:center}
.panel .art{width:46px;height:46px;border-radius:12px;background:var(--g-ink);display:grid;place-items:center;flex:0 0 46px;color:var(--g)}
.panel .art svg{width:22px;height:22px}
.panel h3{font-size:17px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .mt{font-size:12.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:999px;margin:16px 0 10px;cursor:pointer;
  background:linear-gradient(90deg,var(--g-ink) 0 var(--p,0%),rgba(0,0,0,.22) var(--p,0%) 100%)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:transparent}
.seek::-moz-range-thumb{width:16px;height:16px;border:0;background:transparent}
.pl-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto}
.tbig{font-family:var(--mono);font-size:34px;font-weight:500;line-height:1;letter-spacing:-.03em}
.tbig sup{font-size:12px;margin-left:4px;opacity:.7;letter-spacing:0}
.ctrls{display:flex;gap:6px}
.ctrls button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.14);display:grid;place-items:center;color:var(--g-ink)}
.ctrls button.pp{background:var(--g-ink);color:var(--g);width:46px;height:46px}
.ctrls svg{width:16px;height:16px}
.ctrls button:disabled{opacity:.35}

/* mini reproductor */
.mini{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,140%);z-index:45;width:min(440px,calc(100vw - 24px));
  background:rgba(18,18,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:10px 12px;
  display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:12px;align-items:center;transition:transform .45s var(--ease),visibility 0s .45s;box-shadow:0 18px 50px rgba(0,0,0,.7);visibility:hidden;pointer-events:none}
.mini.on{transform:translate(-50%,0);visibility:visible;pointer-events:auto;transition:transform .45s var(--ease)}
.mini .disc{width:44px;box-shadow:0 0 0 2px #0a0a0a}
.mini b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.mini button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.mini .pp{background:var(--g);color:var(--g-ink)}
.mini svg{width:15px;height:15px}
.mini .bar2{position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:2px;background:var(--w3);overflow:hidden}
.mini .bar2 i{display:block;height:100%;width:0;background:var(--g)}

/* gráfico horas */
.chart{position:relative;height:180px;margin-top:18px;padding-left:28px}
.chart .grid{position:absolute;left:28px;right:0;top:0;bottom:24px}
.chart .gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.chart .yl{position:absolute;left:-28px;width:22px;text-align:right;font-size:10.5px;color:var(--faint);transform:translateY(-50%);font-family:var(--mono)}
.cols{position:absolute;left:28px;right:0;top:0;bottom:0;display:flex;align-items:flex-end}
.col{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;padding-bottom:24px;min-width:0}
.col .stack{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;width:min(22px,70%)}
.col .seg{width:100%;height:0;transition:height .9s var(--ease)}
.col .seg.done{background:var(--g)}
.col .seg.rsv{background:var(--g-lo)}
.col .seg.top{border-radius:4px 4px 0 0}
.col .xl{position:absolute;bottom:0;font-size:10px;color:var(--faint);white-space:nowrap;font-family:var(--mono)}
.col .vl{white-space:nowrap;font-size:11px;font-family:var(--mono);margin-bottom:5px;opacity:0;transition:opacity .4s .7s}
.col .vl.on{opacity:1}
.col:hover .stack,.col:focus-visible .stack{filter:brightness(1.25)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:12px}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* constancia */
.heat-top{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.heat{display:grid;grid-template-rows:repeat(8,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,24px);grid-template-columns:16px;gap:4px;margin-top:16px;align-items:center}
.heat .dl{font-size:10px;color:var(--faint);line-height:1;font-family:var(--mono)}
.cell{width:100%;aspect-ratio:1;border-radius:5px;background:var(--w3);transform:scale(.3);opacity:0;transition:transform .5s var(--ease),opacity .4s}
.cell.show{transform:none;opacity:1}
.cell.l1{background:color-mix(in srgb,var(--pc) 30%,#1b1b1b)}.cell.l2{background:color-mix(in srgb,var(--pc) 55%,#1b1b1b)}.cell.l3{background:color-mix(in srgb,var(--pc) 80%,#1b1b1b)}.cell.l4{background:var(--pc)}
.cell.r{background:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pc) 60%,transparent)}
.cell.x{background:none;box-shadow:inset 0 0 0 1.5px rgba(255,107,107,.7)}
.cell.fut{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.wmiss{display:block;height:4px;border-radius:2px;background:var(--bad);margin-top:2px}

/* tarjetas de dato */
.stat .ic{width:34px;height:34px;border-radius:50%;background:var(--w3);display:grid;place-items:center;color:var(--g-hi)}
.stat .ic svg{width:17px;height:17px}
.stat .sh{display:flex;align-items:center;gap:10px}
.stat .big{margin-top:18px}
.delta{font-size:12.5px;color:var(--dim);margin-top:8px}
.delta b{font-weight:600}
.delta .up{color:var(--g-hi)}.delta .dn{color:var(--bad)}

/* ---------- vista de todos (INNIT) ---------- */
.all{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.pcard{display:grid;grid-template-columns:118px 1fr;gap:18px;align-items:center;text-align:left;width:100%;transition:border-color .2s}
.pcard:hover{border-color:rgba(255,255,255,0.20)}
.pcard .rings{max-width:118px}
.pcard h3{font-size:19px;font-weight:600}
.pcard ul{list-style:none;margin-top:10px;display:grid;gap:5px;font-size:13px;color:var(--dim)}
.pcard li i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.pcard li b{color:var(--ink);font-weight:500;font-family:var(--mono)}
.pcard .flag{margin-top:10px;font-size:12.5px;color:var(--g-hi)}

/* ---------- sesiones ---------- */
.h2{font-weight:600;font-size:19px;margin:24px 0 12px}
.rows{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:130px 1fr auto auto;gap:14px;align-items:center;background:var(--w);border:1px solid var(--line);border-radius:20px;padding:14px 18px}
.srow .dt{font-weight:600}
.srow .dt small{display:block;font-weight:400;color:var(--dim);font-size:12.5px}
.srow .wh{color:var(--dim);font-size:13.5px}
.srow .wh b{color:var(--ink);font-weight:500;display:block;font-family:var(--mono)}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--w3);color:var(--dim);white-space:nowrap}
.tag.ok{background:var(--g-deep);color:var(--g-hi)}
.tag.bad{background:rgba(255,107,107,.14);color:var(--bad)}
.empty{color:var(--dim);padding:22px 4px}

/* ---------- música ---------- */
.composer{display:grid;gap:12px}
.seg3{display:flex;gap:4px;background:var(--w2);border-radius:999px;padding:4px;width:fit-content}
.seg3 button{padding:7px 15px;border-radius:999px;font-size:13px;font-weight:600;color:var(--dim)}
.seg3 button[aria-pressed=true]{background:var(--g);color:var(--g-ink)}
.in{width:100%;background:var(--w2);border:1px solid transparent;border-radius:14px;padding:12px 14px}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--g-mid)}
textarea.in{resize:vertical;min-height:70px}
.crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.file{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);cursor:pointer;flex-wrap:wrap}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file:focus-within .cta{outline:2px solid var(--g-hi);outline-offset:3px}
.file .fn{word-break:break-all}
.msg{font-size:13px;color:var(--dim);min-height:18px}
.msg.err{color:var(--bad)}
.filter{display:flex;gap:6px;margin:20px 0 12px;flex-wrap:wrap}
.filter button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--dim)}
.filter button[aria-pressed=true]{border-color:var(--g);color:var(--g-hi)}
.items{display:grid;gap:12px}
.item header{display:flex;gap:12px;align-items:flex-start}
.item .pbtn{width:44px;height:44px;border-radius:50%;background:var(--w3);color:var(--g-hi);display:grid;place-items:center;flex:0 0 44px}
.item .pbtn svg{width:15px;height:15px}
.item.playing .pbtn{background:var(--g);color:var(--g-ink)}
.item h3{font-size:17px;font-weight:600;line-height:1.25;word-break:break-word}
.item .meta{font-size:12.5px;color:var(--dim);margin-top:3px}
.item .note{margin-top:12px;white-space:pre-wrap;word-break:break-word;color:#d6d6d6}
.kind{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;margin-left:auto}
.kind.tema{background:var(--g);color:var(--g-ink)}.kind.refe{background:var(--g-hi);color:var(--g-ink)}.kind.idea{background:var(--w3);color:var(--g-hi)}
.eq{display:none;gap:2px;align-items:flex-end;height:13px;margin-left:8px;vertical-align:-1px}
.eq i{width:3px;background:var(--g);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:13px}}
.item.playing .eq{display:inline-flex}
.seen{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);margin-top:12px}
.seen svg{width:14px;height:14px}
.seen.yes{color:var(--g-hi)}
.thread{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.fb{font-size:14px}
.fb b{font-weight:600}
.fb time{font-size:12px;color:var(--faint);margin-left:6px;font-family:var(--mono)}
.fb p{color:#d6d6d6;white-space:pre-wrap;word-break:break-word}
.fb.innit{border-left:2px solid var(--g);padding-left:10px}
.reply{display:flex;gap:8px;margin-top:4px}
.reply .in{padding:10px 14px}
.del{font-size:12.5px;color:var(--faint);text-decoration:underline;text-underline-offset:3px}
.del:hover,.del.sure{color:var(--bad)}

/* tooltip + diálogo + login */
#tip{position:fixed;z-index:60;background:var(--ink);color:#000;font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:230px}
#tip.on{opacity:1}
dialog{background:var(--w);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:24px;width:min(420px,calc(100vw - 32px));margin:auto}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog h2{font-size:19px;font-weight:600;margin-bottom:10px}
dialog label{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 5px}
dialog .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:min(360px,100%);display:grid;gap:10px}
.login img{height:24px;margin-bottom:18px}
.login h1{margin-bottom:4px}
.login p{color:var(--dim);font-size:14px;margin-bottom:8px}

/* ---------- responsive ---------- */
@media(max-width:1000px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .w.s4{grid-column:span 2}
  .w.r2{grid-row:auto}
}
@media(max-width:820px){
  .bar{padding:14px 16px}
  .wrap{padding:4px 14px 170px}
  .tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 10px 40px rgba(0,0,0,.85)}
  .mini{bottom:calc(84px + env(safe-area-inset-bottom))}
  .who span{display:none}
  .srow{grid-template-columns:1fr auto;row-gap:6px}
  .srow .wh{grid-column:1/-1;order:3}
}
@media(max-width:560px){
  .bento{gap:10px}
  .w{padding:16px;border-radius:24px}
  .w.s1m{grid-column:span 2}
  .pl-body{grid-template-columns:1fr}
  .deck{padding:14px}
  .disc{width:150px}
  .big{font-size:28px}
  .pcard{grid-template-columns:96px 1fr}
  .pcard .rings{max-width:96px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}

<dialog id="goals">

      <div><label for="g-fijo">Días fijos por semana</label><input class="in" id="g-fijo" type="number" min="0" max="7" required></div>

<div id="tip" role="tooltip"></div>

<script>
const sb=supabase.createClient('https://mjmffatrtiieiqxyzwxj.supabase.co','sb_publishable_2JVO27C79lMkmAoEVZmx3g_Xdax_jig');
const TEAM='INNIT COMPANY';
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIA3=['dom','lun','mar','mié','jue','vie','sáb'];
const RING=[{n:'Días fijos',c:'#ffffff',cb:'#e6e6e6'},{n:'Horas',c:'#a6a6a6',cb:'#cfcfcf'},{n:'Racha',c:'#5e5e5e',cb:'#8c8c8c'}];
const PC={'HDMI':'#4a9eff','JOVAEL':'#4ade80','INNIT COMPANY':'#d8d8d8'};const pcOf=n=>PC[n]||'#d8d8d8';
const KIND={tema:'Tema',refe:'Refe',idea:'Idea'};
const MAX_MB=50;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const monday=d=>{const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return m;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const hh=h=>pad(h)+':00';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const hrs=n=>(Math.round(n*10)/10).toString().replace('.',',');
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const I={
  play:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.5v11l9-5.5z"/></svg>',
  pause:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2.5" width="3.6" height="11" rx="1"/><rect x="9.4" y="2.5" width="3.6" height="11" rx="1"/></svg>',
  prev:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M12.5 3v10L5 8z"/><rect x="3" y="3" width="2" height="10" rx="1"/></svg>',
  next:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3.5 3v10L11 8z"/><rect x="11" y="3" width="2" height="10" rx="1"/></svg>',
  check:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
  x:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  avg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18l5-6 4 3 7-9"/></svg>',
  miss:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>'
};
const FLAME='<svg class="flame" viewBox="0 0 46 52" aria-hidden="true"><defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5f3ee"/></linearGradient></defs><path d="M23 2c3 8 13 13 13 27a13 13 0 0 1-26 0c0-7 3-11 6-14 0 5 2 8 5 8-3-7 0-15 2-21z" fill="url(#fl)"/><ellipse cx="23" cy="40" rx="5.5" ry="7" fill="#ffffff"/></svg>';

let me=null,isTeam=false,viewId=null,tab='home',filter='all',kind='tema';
let month=new Date();month=new Date(month.getFullYear(),month.getMonth(),1);
const D={bk:[],sp:[],pf:[],goals:{},noshow:new Set(),items:[],fb:[],seen:{}};

/* ---------- datos ---------- */
async function loadAll(){
  const q=t=>sb.from(t).select('*');
  const [a,b,c,d,e,f,g,h]=await Promise.all([q('bookings'),q('spaces'),q('profiles'),q('member_goals'),q('booking_noshow'),
    sb.from('member_items').select('*').order('created_at',{ascending:false}),
    sb.from('member_feedback').select('*').order('created_at',{ascending:true}),q('member_item_seen')]);
  D.bk=a.data||[];D.sp=b.data||[];D.pf=c.data||[];
  D.goals={};(d.data||[]).forEach(r=>D.goals[r.user_id]=r);
  D.noshow=new Set((e.data||[]).map(r=>r.booking_id));
  D.items=f.data||[];D.fb=g.data||[];
  D.seen={};(h.data||[]).forEach(r=>D.seen[r.item_id]=r.seen_at);
}
const nameOf=id=>(D.pf.find(p=>p.id===id)||{}).name||'—';
const spaceOf=id=>(D.sp.find(s=>s.id===id)||{}).name||'Espacio';
const clients=()=>D.pf.filter(p=>p.name!==TEAM).sort((a,b)=>a.name.localeCompare(b.name));

/* Estado de una reserva: hecha (ya pasó), reservada (futura) o falta (marcada por INNIT) */
function statusOf(b){
  if(D.noshow.has(b.id))return'falta';
  const now=new Date(),t=iso(now);
  return(b.date<t||(b.date===t&&b.end_hour<=now.getHours()))?'hecha':'reservada';
}
function mineOf(uid){return D.bk.filter(b=>b.user_id===uid).sort((x,y)=>x.date.localeCompare(y.date)||x.start_hour-y.start_hour);}
/* tipo del día = el de su primera reserva (igual que el calendario de reservas) */
function dayMap(mine){
  const m={};
  mine.forEach(b=>{const s=statusOf(b),d=m[b.date]||(m[b.date]={type:b.token_type||'extra',done:0,rsv:0,miss:0});
    const h=b.end_hour-b.start_hour; if(s==='hecha')d.done+=h; else if(s==='reservada')d.rsv+=h; else d.miss+=h;});
  return m;
}
function goalsOf(uid){return D.goals[uid]||{fijo_week:2,extra_week:5,hours_month:null,streak_weeks:4,start_date:null};}
/* Semanas ya cerradas en las que no se reservaron todos los días fijos: cuentan solas como falta */
function autoMisses(days,g,mine){
  const start=g.start_date?monday(pd(g.start_date)):(mine.length?monday(pd(mine[0].date)):null);
  if(!start||!g.fijo_week)return[];
  const out=[],last=addDays(monday(new Date()),-7);
  for(let w=new Date(start);w<=last;w=addDays(w,7)){let f=0;
    for(let i=0;i<7;i++){const v=days[iso(addDays(w,i))];if(v&&v.type==='fijo')f++;}
    const n=Math.max(0,g.fijo_week-f);if(n)out.push({w:new Date(w),n});}
  return out;
}
function metrics(uid,mth){
  const mine=mineOf(uid),days=dayMap(mine),g=goalsOf(uid);
  const y=mth.getFullYear(),m=mth.getMonth(),mk=y+'-'+pad(m+1),dim=new Date(y,m+1,0).getDate();
  let mondays=0;for(let d=1;d<=dim;d++)if(new Date(y,m,d).getDay()===1)mondays++;
  const fijoGoal=g.fijo_week*mondays;
  let fijoDone=0,fijoRsv=0,hDone=0,hRsv=0;
  Object.entries(days).forEach(([d,v])=>{if(d.slice(0,7)!==mk)return;
    hDone+=v.done;hRsv+=v.rsv;
    if(v.type==='fijo'){if(v.done>0)fijoDone++;else if(v.rsv>0)fijoRsv++;}});
  const hGoal=g.hours_month||Math.max(fijoGoal*4,4);
  /* racha: semanas seguidas (lunes a domingo) cumpliendo los días fijos */
  const need=Math.max(1,g.fijo_week),today=new Date(),endM=new Date(y,m+1,0);
  const ref=endM<today?endM:today,liveWeek=ref===today;
  const wkDone=w=>{let n=0;for(let i=0;i<7;i++){const v=days[iso(addDays(w,i))];if(v&&v.done>0)n++;}return n;};
  let w=monday(ref),streak=0;
  if(wkDone(w)>=need)streak++;else if(!liveWeek){w=null;}
  if(w){w=addDays(w,-7);while(wkDone(w)>=need&&streak<520){streak++;w=addDays(w,-7);}}
  let best=0,run=0;
  if(mine.length){for(let x=monday(pd(mine[0].date));x<=today;x=addDays(x,7)){if(wkDone(x)>=need){run++;best=Math.max(best,run);}else if(monday(today).getTime()!==x.getTime())run=0;}}
  const allDone=Object.values(days).filter(v=>v.done>0);
  const misses=autoMisses(days,g,mine);
  return{mine,days,g,misses,mondays,fijoGoal,fijoDone,fijoRsv,hGoal,hDone,hRsv,streak,streakGoal:g.streak_weeks,best:Math.max(best,streak),
    totalDays:allDone.length,totalHours:allDone.reduce((s,v)=>s+v.done,0),
    rings:[{p:fijoGoal?fijoDone/fijoGoal:0,r:fijoGoal?(fijoDone+fijoRsv)/fijoGoal:0},{p:hDone/hGoal,r:(hDone+hRsv)/hGoal},{p:streak/g.streak_weeks,r:0}]};
}
/* datos de un periodo [from,to] para las tarjetas con comparativa */
function periodStats(days,from,to,misses){
  let s=0,h=0,x=0;const f=iso(from),t=iso(to);
  Object.entries(days).forEach(([d,v])=>{if(d<f||d>t)return;if(v.done>0){s++;h+=v.done;}else if(v.miss>0)x++;});
  (misses||[]).forEach(m=>{const d=iso(m.w);if(d>=f&&d<=t)x+=m.n;});
  return{s,h,avg:s?h/s:0,x};
}
function compare(M){
  const now=new Date(),y=month.getFullYear(),m=month.getMonth(),isCur=y===now.getFullYear()&&m===now.getMonth();
  const end=isCur?now:new Date(y,m+1,0),pEndFull=new Date(y,m,0);
  const pEnd=isCur?new Date(y,m-1,Math.min(now.getDate(),pEndFull.getDate())):pEndFull;
  return{cur:periodStats(M.days,new Date(y,m,1),end,M.misses),prev:periodStats(M.days,new Date(y,m-1,1),pEnd,M.misses),
    label:(isCur?'vs el mismo día de ':'vs ')+MES[(m+11)%12].slice(0,3)+'.',eq:(isCur?'Igual que el mismo día de ':'Igual que en ')+MES[(m+11)%12].slice(0,3)+'.'};
}

/* ---------- anillos ---------- */
let uidc=0;
function ringsSvg(rings,mini){
  const id='g'+(++uidc),sw=mini?24:22,R=[112,86,60];
  const defs=RING.map((r,i)=>`<linearGradient id="${id}${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${r.c}"/><stop offset="1" stop-color="${r.cb}"/></linearGradient>`).join('');
  const gs=rings.map((v,i)=>{const C=2*Math.PI*R[i];
    return `<g class="r${i}"><circle class="trk" cx="130" cy="130" r="${R[i]}" stroke="${RING[i].c}" stroke-width="${sw}"/>
      <circle class="res" cx="130" cy="130" r="${R[i]}" stroke="${RING[i].c}" stroke-width="${sw}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-c="${C}" data-p="${Math.min(v.r,1)}" style="${v.r>0?'':'display:none'}"/>
      <circle class="arc" cx="130" cy="130" r="${R[i]}" stroke="url(#${id}${i})" stroke-width="${sw}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-c="${C}" data-p="${Math.min(v.p,1)}" style="${v.p>0?'':'display:none'};transition-delay:${i*140}ms"/>
      <circle class="pulse" cx="130" cy="130" r="${R[i]}" stroke="${RING[i].cb}" stroke-width="${sw}" data-full="${v.p>=1?1:0}" data-d="${1500+i*140}"/></g>`;}).join('');
  return `<svg viewBox="0 0 260 260" aria-hidden="true"><defs>${defs}</defs>${gs}</svg>`;
}
function drawRings(root){
  const go=()=>root.querySelectorAll('.rings .arc,.rings .res').forEach(c=>{c.style.strokeDashoffset=(+c.dataset.c)*(1-(+c.dataset.p));});
  if(reduced){go();return;}
  requestAnimationFrame(()=>requestAnimationFrame(go));
  root.querySelectorAll('.pulse[data-full="1"]').forEach(c=>setTimeout(()=>c.classList.add('go'),+c.dataset.d));
}
function countUp(root){
  root.querySelectorAll('[data-n]').forEach(el=>{const to=+el.dataset.n,dec=el.dataset.dec==='1';
    const put=v=>el.textContent=dec?hrs(v):Math.round(v);
    if(reduced||!to){put(to);return;}
    const t0=performance.now(),dur=1100;
    (function step(t){const k=Math.min((t-t0)/dur,1),e=1-Math.pow(1-k,3);put(to*e);if(k<1)requestAnimationFrame(step);})(t0);});
}

/* ---------- inicio ---------- */
function headline(M,name){
  const now=new Date(),cur=month.getFullYear()===now.getFullYear()&&month.getMonth()===now.getMonth(),past=month<new Date(now.getFullYear(),now.getMonth(),1),mes=MES[month.getMonth()];
  const n=name?esc(name)+' ':'';
  if(!M.mine.length)return name?`${n}todavía no ha venido al estudio.`:'Tu primer día en el estudio te está esperando.';
  if(!M.fijoGoal)return`${name?n+'suma ':''}${hrs(M.hDone)} horas en el estudio en ${mes}.`;
  if(M.fijoDone>=M.fijoGoal)return`${name?n+'completó el mes':'Mes completo'}: ${M.fijoDone} de ${M.fijoGoal} días fijos.`;
  if(past)return`${name?n+'hizo':'Hiciste'} ${M.fijoDone} de ${M.fijoGoal} días fijos en ${mes}.`;
  if(!cur)return`${name?n+'tiene ':''}${M.fijoRsv} de ${M.fijoGoal} días fijos reservados para ${mes}.`;
  return`${name?n+'lleva':'Llevas'} ${M.fijoDone} de ${M.fijoGoal} días fijos en ${mes}.`;
}
function wRings(M){
  const vals=[[`${M.fijoDone}/${M.fijoGoal}`,'días fijos'],[`${hrs(M.hDone)} h`,`de ${M.hGoal} h`],[`${M.streak}`,M.streak===1?'semana seguida':'semanas seguidas']];

    <div class="legend" id="legend" data-c='${esc(JSON.stringify(vals))}' data-d='${esc(JSON.stringify([Math.round(Math.min(M.rings[0].p,9.99)*100)+'%','del mes']))}'>${leg}</div></div>`;
}
function wStreak(M){
  const today=new Date(),ti=iso(today),w0=monday(today),L=['L','M','X','J','V','S','D'];
  const cells=L.map((l,i)=>{const d=addDays(w0,i),di=iso(d),v=M.days[di];let cls='',ic='',tip=`${cap(DIA[d.getDay()])} ${d.getDate()}: `;
    if(v&&v.done>0){cls='done';ic=I.check;tip+=`${hrs(v.done)} h en el estudio`;}
    else if(v&&v.rsv>0){cls=di===ti?'today':'rsv';tip+=`${hrs(v.rsv)} h reservadas`;}
    else if(v&&v.miss>0){cls='miss';ic=I.x;tip+='falta';}

    return `<div class="day ${di===ti?'now':''}"><div class="c ${cls}" data-tip="${esc(tip)}" data-i="${i}">${ic}</div><span>${l}</span></div>`;}).join('');
  const pct=M.fijoGoal?Math.round(M.fijoDone/M.fijoGoal*100):0;
  return `<div class="w s2 glow">
    <div class="streak-top">${FLAME.replace('class="flame"',`class="flame ${M.streak?'':'off'}"`)}<div><div class="lbl">Racha</div><div class="big"><span data-n="${M.streak}">0</span><small>${M.streak===1?'semana':'semanas'}</small></div></div></div>
    <div class="hr"></div>
    <div class="week">${cells}</div>
    <div class="hr"></div>
    <div class="lbl">Días fijos de ${MES[month.getMonth()]}</div>

    <div class="meter"><i data-w="${Math.min(pct,100)}"></i></div>
  </div>`;
}
function wTokens(M){
  const w0=monday(new Date());let f=0,x=0,fr=0,xr=0;
  for(let i=0;i<7;i++){const v=M.days[iso(addDays(w0,i))];if(!v)continue;const used=v.done>0||v.rsv>0;if(!used)continue;const done=v.done>0;
    if(v.type==='fijo'){f++;if(!done)fr++;}else{x++;if(!done)xr++;}}
  const dots=(n,used,rs)=>Array.from({length:Math.max(n,used)},(_,i)=>`<i class="${i<used-rs?'on':i<used?'rs':''}" data-i="${i}"></i>`).join('');
  return `<div class="w s1m"><div class="wt">Tokens de la semana</div><div class="lbl" style="margin-top:2px">Se renuevan cada lunes</div>
    <div class="tok"><div><div class="row"><span class="lbl">Fijos</span><b>${f}/${M.g.fijo_week}</b></div><div class="dots">${dots(M.g.fijo_week,f,fr)}</div></div>
    <div><div class="row"><span class="lbl">Extra</span><b>${x}/${M.g.extra_week??5}</b></div><div class="dots">${dots(M.g.extra_week??5,x,xr)}</div></div></div>
    <div class="key"><span><i style="background:var(--g)"></i>Usado</span><span><i style="background:var(--g-lo)"></i>Reservado</span></div></div>`;

function wNext(M){

  const list=up.slice(0,3).map(b=>{const d=pd(b.date);return `<div class="ni"><b>${cap(DIA3[d.getDay()])} ${d.getDate()} ${MES3[d.getMonth()]} · ${hh(b.start_hour)}–${hh(b.end_hour)}</b><span>${esc(spaceOf(b.space_id))}</span></div>`;}).join('');
  return `<div class="w s1m"><div class="nxt-h"><div class="wt">Próximas</div><span class="badge">${up.length}</span></div>
    ${list?`<div class="nlist">${list}</div>`:`<p class="empty" style="padding:14px 0 10px">Nada reservado todavía.</p>${isTeam?'':'<a class="cta" href="index.html">Reservar un día</a>'}`}</div>`;
}
function wHours(M){
  const cur=monday(new Date()),wks=[];
  for(let i=11;i>=0;i--){const w=addDays(cur,-7*i);let done=0,rsv=0;for(let k=0;k<7;k++){const v=M.days[iso(addDays(w,k))];if(v){done+=v.done;rsv+=v.rsv;}}wks.push({w,done,rsv});}
  const raw=Math.max(...wks.map(x=>x.done+x.rsv),4),top=raw<=20?Math.ceil(raw/4)*4:Math.ceil(raw/10)*10,H=156;
  const maxI=wks.reduce((b,x,i)=>x.done+x.rsv>wks[b].done+wks[b].rsv?i:b,0);
  const cols=wks.map((x,i)=>{const tot=x.done+x.rsv,e=addDays(x.w,6);
    const tipTxt=`Semana del ${x.w.getDate()} ${MES3[x.w.getMonth()]} al ${e.getDate()} ${MES3[e.getMonth()]}: ${hrs(x.done)} h hechas${x.rsv?`, ${hrs(x.rsv)} h reservadas`:''}`;
    const lab=(i===11||i===maxI)&&tot>0;
    return `<div class="col" tabindex="0" data-tip="${esc(tipTxt)}" aria-label="${esc(tipTxt)}">
      <span class="vl ${lab?'lab':''}">${lab?hrs(tot)+' h':''}</span>
      <div class="stack">${x.rsv?`<div class="seg rsv top" data-h="${x.rsv/top*H}"></div>`:''}${x.done?`<div class="seg done ${x.rsv?'':'top'}" data-h="${x.done/top*H}" style="transition-delay:${i*45}ms"></div>`:''}</div>
      <span class="xl">${i%3===2||i===11?x.w.getDate()+' '+MES3[x.w.getMonth()]:''}</span></div>`;}).join('');
  const gl=[top,top/2,0].map(v=>`<div class="gl" style="bottom:${v/top*H}px"><span class="yl">${v}</span></div>`).join('');
  return `<div class="w s2"><div class="wt">Horas por semana</div><div class="lbl" style="margin-top:2px">Últimas 12 semanas</div>
    <div class="chart" role="img" aria-label="Horas por semana en las últimas 12 semanas"><div class="grid">${gl}</div><div class="cols">${cols}</div></div>
    <div class="key"><span><i style="background:var(--g)"></i>Hechas</span><span><i style="background:var(--g-lo)"></i>Reservadas</span></div></div>`;
}
function wHeat(M){
  const cur=monday(new Date()),t=iso(new Date());let out=['L','','X','','V','','D',''].map(l=>`<span class="dl">${l}</span>`).join(''),n=0;
  for(let i=15;i>=0;i--){const w=addDays(cur,-7*i);
    for(let k=0;k<7;k++){const d=addDays(w,k),di=iso(d),v=M.days[di];
      let cls=di>t?'fut':'',txt='sin sesión';
      if(v){if(v.done>0){cls=v.done>=10?'l4':v.done>=7?'l3':v.done>=4?'l2':'l1';txt=`${hrs(v.done)} h en el estudio`;}else if(v.rsv>0){cls='r';txt=`${hrs(v.rsv)} h reservadas`;}else{cls='x';txt='falta';}}
      const tipTxt=`${cap(DIA[d.getDay()])} ${d.getDate()} ${MES3[d.getMonth()]}: ${txt}`;
      out+=`<div class="cell ${cls}" data-tip="${esc(tipTxt)}" data-i="${n++}"${v?` tabindex="0" aria-label="${esc(tipTxt)}"`:''}></div>`;}
    const ms=M.misses.find(x=>x.w.getTime()===w.getTime());
    out+=ms?`<span class="wmiss" tabindex="0" data-tip="${esc(`Semana del ${w.getDate()} ${MES3[w.getMonth()]}: ${ms.n} ${ms.n===1?'día fijo':'días fijos'} sin reservar`)}" aria-label="${ms.n} días fijos sin reservar"></span>`:'<span></span>';}
  return `<div class="w s2"><div class="heat-top"><div><div class="big"><span data-n="${M.totalDays}">0</span><small>días</small></div><div class="lbl" style="margin-top:6px">En total</div></div>
    <div><div class="big"><span data-n="${M.best}">0</span><small>sem</small></div><div class="lbl" style="margin-top:6px">Mejor racha</div></div></div>
    <div class="heat">${out}</div>
    <div class="key"><span><i style="background:color-mix(in srgb,var(--pc) 30%,#1b1b1b)"></i>1–3 h</span><span><i style="background:color-mix(in srgb,var(--pc) 55%,#1b1b1b)"></i>4–6 h</span><span><i style="background:color-mix(in srgb,var(--pc) 80%,#1b1b1b)"></i>7–9 h</span><span><i style="background:var(--pc)"></i>10 h o más</span><span><i style="box-shadow:inset 0 0 0 1.5px rgba(255,107,107,.7)"></i>Falta</span><span><i style="background:var(--bad);height:4px;vertical-align:2px"></i>Semana con fijos sin reservar</span></div></div>`;
}
function wStats(M){
  const C=compare(M);
  const d=(a,b,lowGood)=>{if(!a&&!b)return`<span>${C.eq}</span>`;if(!b)return`<b class="${lowGood?'dn':'up'}">Nuevo</b> ${C.label}`;
    const p=Math.round((a-b)/b*100);if(!p)return`<b>0 %</b> ${C.label}`;const good=lowGood?p<0:p>0;return`<b class="${good?'up':'dn'}">${p>0?'+':''}${p} %</b> ${C.label}`;};
  const card=(ic,l,v,dec,u,delta)=>`<div class="w stat"><div class="sh"><span class="ic">${ic}</span><span class="wt">${l}</span></div><div class="big"><span data-n="${v}"${dec?' data-dec="1"':''}>0</span>${u?`<small>${u}</small>`:''}</div><div class="delta">${delta}</div></div>`;
  return card(I.cal,'Sesiones',C.cur.s,0,'',d(C.cur.s,C.prev.s))+card(I.clock,'Horas',C.cur.h,1,'h',d(C.cur.h,C.prev.h))
    +card(I.avg,'Media por sesión',Math.round(C.cur.avg*10)/10,1,'h',d(C.cur.avg,C.prev.avg))+card(I.miss,'Faltas',C.cur.x,0,'',d(C.cur.x,C.prev.x,true)+'<br><span style="color:var(--faint)">Incluye días fijos sin reservar</span>');
}

function animateHome(root){

  reduced?run():requestAnimationFrame(()=>requestAnimationFrame(run));

  const C=JSON.parse(lg.dataset.c),def=JSON.parse(lg.dataset.d);let pinned=-1;
  const show=i=>{rg.classList.remove('f0','f1','f2');lg.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i));
    const v=i<0?def:C[i];if(i>=0)rg.classList.add('f'+i);ce.querySelector('b').textContent=v[0];ce.querySelector('span').textContent=v[1];};

    return `<div class="srow"><div class="dt">${cap(DIA[d.getDay()])} ${d.getDate()}<small>${MES[d.getMonth()]} ${d.getFullYear()}</small></div>
      <div class="wh"><b>${hh(b.start_hour)}–${hh(b.end_hour)}</b>${esc(spaceOf(b.space_id))} · ${ty}</div>
      <span class="tag ${s==='falta'?'bad':s==='hecha'?'ok':''}">${s==='falta'?'Falta':s==='hecha'?'Hecha':'Reservada'}</span>
      ${isTeam&&s!=='reservada'?`<button class="txtbtn" data-noshow="${b.id}">${s==='falta'?'Quitar falta':'Marcar falta'}</button>`:'<span></span>'}</div>`;};
  const up=mine.filter(b=>statusOf(b)==='reservada');
  const misses=autoMisses(days,goalsOf(uid),mine);
  const missRow=m=>{const e=addDays(m.w,6);return `<div class="srow"><div class="dt">Semana<small>${m.w.getDate()} ${MES3[m.w.getMonth()]} – ${e.getDate()} ${MES3[e.getMonth()]}</small></div>

  const past=[...mine.filter(b=>statusOf(b)!=='reservada').map(b=>({k:b.date+'~'+String(b.start_hour).padStart(2,'0'),h:()=>row(b)})),

  return `${peopleBar()}<h2 class="h2" style="margin-top:6px">Próximas</h2><div class="rows">${up.map(row).join('')||`<p class="empty">No hay días reservados. ${isTeam?'':'<a href="index.html">Reserva uno</a>.'}</p>`}</div>

    <textarea class="in" id="c-note" placeholder="${kind==='idea'?'Cuéntala con calma':'Notas: qué buscas, qué te falta, en qué fijarse'}" maxlength="2000"></textarea>
    ${kind==='idea'?'':`<div class="crow"><label class="file"><input id="c-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg"><span class="cta line">Elegir audio</span><span class="fn" id="c-fn">mp3, wav o m4a, hasta ${MAX_MB} MB</span></label></div>
    <input class="in" id="c-link" type="url" placeholder="O pega un enlace (Spotify, YouTube, SoundCloud)" maxlength="500">`}
    <div class="crow"><button class="cta" type="submit" id="c-go">Subir a ${who}</button><span class="msg" id="c-msg"></span></div>
  </form>
  <div class="filter" role="group" aria-label="Filtrar">${[['all','Todo'],['tema','Temas'],['refe','Refes'],['idea','Ideas']].map(([k,v])=>`<button type="button" data-filter="${k}" aria-pressed="${filter===k}">${v}</button>`).join('')}</div>
  <div class="items">${items||`<p class="empty">${all.length?'Nada en este filtro.':isTeam?'Todavía no ha subido nada.':'Sube tu primer tema, una refe o una idea. Lo escuchamos y te contamos.'}</p>`}</div>`;
}

/* ---------- reproductor: un solo audio para toda la página ---------- */
const audio=new Audio();audio.preload='none';
const P={owner:null,queue:[],idx:-1,started:false};const urls={};
const curItem=()=>D.items.find(i=>i.id===P.queue[P.idx]);
function setQueue(uid){
  const q=D.items.filter(i=>i.owner_id===uid&&i.file_path).map(i=>i.id);
  if(P.owner!==uid){if(P.started){audio.pause();audio.removeAttribute('src');}P.owner=uid;P.started=false;P.queue=q;P.idx=q.length?0:-1;}
  else{const keep=P.queue[P.idx];P.queue=q;P.idx=q.indexOf(keep);if(P.idx<0){P.idx=q.length?0:-1;if(P.started){audio.pause();P.started=false;}}}
}
async function playIdx(i){
  if(i<0||i>=P.queue.length)return;P.idx=i;const it=curItem();
  if(!urls[it.id]){const {data,error}=await sb.storage.from('miembros').createSignedUrl(it.file_path,3600);
    if(error||!data){ledText('NO SE PUDO CARGAR EL AUDIO');return;}urls[it.id]=data.signedUrl;}
  audio.src=urls[it.id];P.started=true;try{await audio.play();}catch(e){}syncAll();
}
function toggle(){if(!P.queue.length)return;if(!P.started)return playIdx(Math.max(P.idx,0));audio.paused?audio.play():audio.pause();}
audio.addEventListener('ended',()=>{if(P.idx<P.queue.length-1)playIdx(P.idx+1);else syncAll();});
['play','pause','loadedmetadata'].forEach(e=>audio.addEventListener(e,syncAll));
audio.addEventListener('timeupdate',syncTime);
function syncTime(){
  const d=audio.duration,c=audio.currentTime,p=d?c/d*100:0;
  const s=$('pl-seek');if(s&&!s.matches(':active')){s.value=Math.round(p*10);s.style.setProperty('--p',p+'%');}
  const t=$('pl-time');if(t)t.innerHTML=`${fmtT(c)}<sup>${fmtT(d)}</sup>`;
  $('mini-p').style.width=p+'%';$('mini-s').textContent=`${fmtT(c)} / ${fmtT(d)}`;
}
function syncAll(){
  const it=curItem(),on=P.started&&!audio.paused,owner=nameOf(P.owner);
  if($('pl')){
    $('pl-t').textContent=it?it.title:'Aún no hay temas';
    $('pl-m').textContent=it?`${KIND[it.kind]} · ${ago(it.created_at)}${it.added_by!==it.owner_id?' · de INNIT':''}`:(isTeam?'Cuando suba audio aparecerá aquí':'Sube tu primer audio en Música');
    $('pl-pp').innerHTML=on?I.pause:I.play;$('pl-pp').setAttribute('aria-label',on?'Pausar':'Reproducir');
    $('pl-pp').disabled=!it;$('pl-prev').disabled=P.idx<=0;$('pl-next').disabled=P.idx<0||P.idx>=P.queue.length-1;
    $('pl-disc').classList.toggle('on',on);
    ledText(it?`INNIT > ${owner} · ${it.title}`:`INNIT > ${owner} · ${isTeam?'SIN TEMAS':'SUBE TU PRIMER TEMA'}`);
  }
  document.querySelectorAll('.item').forEach(el=>{const a=it&&el.dataset.item===it.id&&on;el.classList.toggle('playing',!!a);const b=el.querySelector('[data-playitem]');if(b)b.innerHTML=a?I.pause:I.play;});
  $('mini-t').textContent=it?it.title:'';$('mini-pp').innerHTML=on?I.pause:I.play;$('mini-disc').classList.toggle('on',on);
  miniVis();syncTime();
}
let plVisible=false;const io=new IntersectionObserver(es=>{es.forEach(e=>plVisible=e.isIntersecting);miniVis();});
function miniVis(){$('mini').classList.toggle('on',P.started&&!plVisible);}
$('mini-pp').onclick=toggle;
$('mini-x').onclick=()=>{audio.pause();P.started=false;syncAll();};
function bindPlayer(){
  const pl=$('pl');io.disconnect();plVisible=false;if(!pl){miniVis();return;}io.observe(pl);
  $('pl-pp').onclick=toggle;$('pl-prev').onclick=()=>playIdx(P.idx-1);$('pl-next').onclick=()=>playIdx(P.idx+1);
  const s=$('pl-seek');s.oninput=()=>{s.style.setProperty('--p',s.value/10+'%');if(P.started&&audio.duration)audio.currentTime=s.value/1000*audio.duration;};
  ledStart();syncAll();
}
/* pantalla LED de puntos */
let ledTxt='',ledBits=null,ledW=0,ledOff=0,ledRaf=0,ledLast=0;const ROWS=9;
function ledText(t){t=t.toUpperCase();if(t===ledTxt)return;ledTxt=t;ledBits=null;}
function ledBuild(){
  const c=document.createElement('canvas'),x=c.getContext('2d'),font=`700 ${ROWS+2}px "Geist Mono",monospace`;
  x.font=font;const w=Math.ceil(x.measureText(ledTxt+'   ·   ').width);c.width=w;c.height=ROWS;x.font=font;x.fillStyle='#fff';x.textBaseline='middle';x.fillText(ledTxt+'   ·   ',0,ROWS/2+1);
  const d=x.getImageData(0,0,w,ROWS).data;ledBits=[];for(let i=0;i<w;i++){const col=[];for(let j=0;j<ROWS;j++)col.push(d[(j*w+i)*4+3]>110);ledBits.push(col);}ledW=w;
}
function ledDraw(t){
  const cv=$('led');if(!cv){ledRaf=0;return;}
  ledRaf=requestAnimationFrame(ledDraw);if(t-ledLast<45)return;ledLast=t;
  const dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  if(!ledBits)ledBuild();
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const pitch=H/(ROWS+2),r=pitch*.36,cols=Math.floor(W/pitch);
  if(!reduced)ledOff=(ledOff+(P.started&&!audio.paused?1:.5))%ledW;
  for(let i=0;i<cols;i++){const src=ledBits[Math.floor(i+ledOff)%ledW];
    for(let j=0;j<ROWS;j++){const on=src&&src[j];x.beginPath();x.arc(i*pitch+pitch/2,(j+1)*pitch+pitch/2,r,0,6.2832);
      x.fillStyle=on?'#ffffff':'#1c1c1c';x.shadowBlur=on?6:0;x.shadowColor='#f5f3ee';x.fill();}}
  x.shadowBlur=0;
}
function ledStart(){if(!ledRaf)ledRaf=requestAnimationFrame(ledDraw);}
document.fonts&&document.fonts.ready.then(()=>{ledBits=null;});

const EXT={mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',ogg:'audio/ogg'};
async function submitItem(e){
  e.preventDefault();
  const msg=$('c-msg'),btn=$('c-go'),say=(t,err)=>{msg.textContent=t;msg.classList.toggle('err',!!err);};
  const title=$('c-title').value.trim(),note=$('c-note').value.trim()||null;
  const file=$('c-file')&&$('c-file').files[0],linkRaw=$('c-link')?$('c-link').value.trim():'';
  if(linkRaw&&!safeLink(linkRaw))return say('El enlace tiene que empezar por https://',true);
  let path=null,fname=null;
  if(file){
    const type=file.type||EXT[(file.name.split('.').pop()||'').toLowerCase()]||'';
    if(!type.startsWith('audio/'))return say('Ese archivo no es de audio. Sube mp3, wav o m4a.',true);
    if(file.size>MAX_MB*1048576)return say(`El archivo pesa ${Math.round(file.size/1048576)} MB y el máximo son ${MAX_MB}. Expórtalo en mp3.`,true);
    btn.disabled=true;say('Subiendo el audio…');
    path=viewId+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');fname=file.name;
    const up=await sb.storage.from('miembros').upload(path,file,{contentType:type});
    if(up.error){btn.disabled=false;return say('No se pudo subir: '+up.error.message,true);}
  }
  btn.disabled=true;
  const {error}=await sb.from('member_items').insert({owner_id:viewId,kind,title,note,link:linkRaw||null,file_path:path,file_name:fname});
  btn.disabled=false;
  if(error){if(path)await sb.storage.from('miembros').remove([path]);return say('No se pudo guardar: '+error.message,true);}
  await loadAll();filter='all';render();
}
async function markSeen(uid){
  const todo=D.items.filter(i=>i.owner_id===uid&&i.added_by===uid&&!D.seen[i.id]);
  if(!todo.length)return;
  const {error}=await sb.from('member_item_seen').insert(todo.map(i=>({item_id:i.id})));
  if(!error){const now=new Date().toISOString();todo.forEach(i=>D.seen[i.id]=now);}
}
/* aviso de feedback nuevo para el miembro (se recuerda en este navegador) */
const fbKey=()=>'innit_fb_'+me.id;
function newFb(){let last='';try{last=localStorage.getItem(fbKey())||'';}catch(e){}
  return D.fb.some(f=>f.author_id!==me.id&&f.created_at>last)||D.items.some(i=>i.owner_id===me.id&&i.added_by!==me.id&&i.created_at>last);}
function clearFb(){try{localStorage.setItem(fbKey(),new Date().toISOString());}catch(e){}}

/* ---------- render ---------- */
function render(){
  const m=$('main'),all=isTeam&&viewId==='all';
  $('tabs').classList.toggle('hide',all);
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  if(!all)setQueue(viewId);
  document.documentElement.style.setProperty('--pc',all?'#d8d8d8':pcOf(nameOf(viewId)));
  if(all){m.innerHTML=vAll();drawRings(m);}
  else if(tab==='home'){m.innerHTML=vHome(viewId);animateHome(m);}
  else if(tab==='ses')m.innerHTML=vSes(viewId);
  else{m.innerHTML=vMus(viewId);if(isTeam)markSeen(viewId);else clearFb();}
  $('mus-dot').classList.toggle('hide',isTeam||tab==='mus'||!newFb());
  bind(m);bindPlayer();
}
function bind(m){
  m.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{viewId=b.dataset.view;render();window.scrollTo(0,0);});
  const p=$('m-prev'),n=$('m-next');
  if(p)p.onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render();};
  if(n)n.onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render();};
  const gb=$('goals-btn');if(gb)gb.onclick=openGoals;
  m.querySelectorAll('[data-noshow]').forEach(b=>b.onclick=async()=>{const id=b.dataset.noshow;b.disabled=true;
    if(D.noshow.has(id))await sb.from('booking_noshow').delete().eq('booking_id',id);else await sb.from('booking_noshow').insert({booking_id:id});
    await loadAll();render();});
  m.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{const t=$('c-title').value,nt=$('c-note').value;kind=b.dataset.kind;render();$('c-title').value=t;$('c-note').value=nt;});
  m.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();});
  const cf=$('composer');if(cf)cf.onsubmit=submitItem;
  const fi=$('c-file');if(fi)fi.onchange=()=>{$('c-fn').textContent=fi.files[0]?fi.files[0].name:`mp3, wav o m4a, hasta ${MAX_MB} MB`;};
  m.querySelectorAll('[data-playitem]').forEach(b=>b.onclick=()=>{const i=P.queue.indexOf(b.dataset.playitem);if(i===P.idx&&P.started)toggle();else playIdx(i);});
  m.querySelectorAll('[data-reply]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const inp=f.querySelector('input'),body=inp.value.trim();if(!body)return;
    f.querySelector('button').disabled=true;
    const {error}=await sb.from('member_feedback').insert({item_id:f.dataset.reply,body});
    if(error){f.querySelector('button').disabled=false;inp.setCustomValidity('No se pudo enviar');inp.reportValidity();inp.setCustomValidity('');return;}
    await loadAll();render();});
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='¿Seguro? Pulsa otra vez para borrar';setTimeout(()=>{b.classList.remove('sure');b.textContent='Borrar';},4000);return;}
    const it=D.items.find(i=>i.id===b.dataset.del);if(!it)return;
    if(curItem()&&curItem().id===it.id){audio.pause();P.started=false;}
    if(it.file_path)await sb.storage.from('miembros').remove([it.file_path]);
    await sb.from('member_items').delete().eq('id',it.id);
    await loadAll();render();});
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;render();window.scrollTo(0,0);});

/* objetivos (solo INNIT) */
function openGoals(){const g=goalsOf(viewId);$('g-title').textContent='Objetivos de '+nameOf(viewId);
  $('g-fijo').value=g.fijo_week;$('g-extra').value=g.extra_week??5;$('g-hours').value=g.hours_month||'';$('g-streak').value=g.streak_weeks;$('g-start').value=g.start_date||'';$('g-err').textContent='';$('goals').showModal();}
$('g-cancel').onclick=()=>$('goals').close();
$('g-form').onsubmit=async e=>{e.preventDefault();
  const {error}=await sb.from('member_goals').upsert({user_id:viewId,fijo_week:+$('g-fijo').value,extra_week:+$('g-extra').value,hours_month:$('g-hours').value?+$('g-hours').value:null,streak_weeks:+$('g-streak').value,start_date:$('g-start').value||null});
  if(error){$('g-err').textContent='No se pudo guardar: '+error.message;return;}
  $('goals').close();await loadAll();render();};

/* tooltip compartido */
const tip=$('tip');
function showTip(el){tip.textContent=el.dataset.tip;tip.classList.add('on');const r=el.getBoundingClientRect(),w=tip.offsetWidth;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px';}
['mouseover','focusin','click'].forEach(ev=>document.addEventListener(ev,e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);else if(ev!=='focusin')tip.classList.remove('on');}));
document.addEventListener('focusout',()=>tip.classList.remove('on'));
addEventListener('scroll',()=>tip.classList.remove('on'),{passive:true});

/* ---------- sesión ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('app').classList.add('hide');$('login').classList.remove('hide');return;}
  const {data:prof}=await sb.from('profiles').select('name').eq('id',session.user.id).single();
  me={id:session.user.id,name:prof?prof.name:session.user.email};isTeam=me.name===TEAM;
  await loadAll();
  viewId=isTeam?'all':me.id;
  $('who').textContent=isTeam?'INNIT':me.name;$('to-cuentas').classList.toggle('hide',!isTeam);
  $('login').classList.add('hide');$('app').classList.remove('hide');
  render();
}
$('l-form').onsubmit=async e=>{e.preventDefault();$('l-err').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('l-email').value.trim(),password:$('l-pass').value});
  if(error){$('l-err').textContent='Email o contraseña incorrectos.';return;}
  boot();};
$('logout').onclick=async()=>{audio.pause();await sb.auth.signOut();location.reload();};
boot();
</script>
